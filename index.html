<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noodle House - Deluxe Crafting Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .mobile-container {
            width: 375px;
            height: 667px;
            background: #fffdfa;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 8px solid #222;
        }

        .header { background: #b71c1c; color: #fff; padding: 10px; text-align: center; font-weight: bold; letter-spacing: 1px; font-size: 16px; }
        .stats-bar { display: flex; justify-content: space-around; background: #d32f2f; color: #fff; padding: 6px; font-size: 13px; font-weight: 600; }
        
        .counter-area {
            flex: 1;
            background: linear-gradient(to bottom, #ffe0b2, #fff3e0);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            position: relative;
        }

        .customer-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            width: 92%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 2px solid #ffcc80;
        }
        .avatar { font-size: 40px; }
        .order-bubble {
            background: #ffe0b2;
            border: 2px dashed #f57c00;
            padding: 6px 10px;
            border-radius: 12px;
            display: inline-block;
            font-weight: bold;
            color: #e65100;
            margin-top: 4px;
            font-size: 12px;
        }

        /* Bowl Preparation Area */
        .bowl-area {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            width: 92%;
            padding: 8px;
            text-align: center;
            min-height: 60px;
        }
        .bowl-title { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 3px; font-weight: bold; }
        .current-ingredients { font-size: 18px; min-height: 25px; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }

        /* Kitchen & Ingredients Area */
        .kitchen-section { background: #212121; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .section-title { color: #ffcc80; font-size: 11px; font-weight: bold; text-align: center; letter-spacing: 0.5px; }
        
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .ing-btn {
            background: #333333;
            border: 1px solid #f57c00;
            border-radius: 6px;
            padding: 6px 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #ffffff;
            cursor: pointer;
        }
        .ing-btn:active { transform: scale(0.95); background: #f57c00; }
        .ing-btn span { font-size: 18px; margin-bottom: 2px; }

        .action-btns { display: flex; gap: 6px; margin-top: 2px; }
        .serve-btn { flex: 2; background: #2e7d32; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .clear-btn { flex: 1; background: #c62828; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .message {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            font-weight: bold;
            z-index: 10;
            border: 1px solid #f57c00;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">🍜 DELUXE NOODLE HOUSE 🍜</div>
    
    <div class="stats-bar">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">120</span>s</div>
    </div>

    <div class="counter-area">
        <div id="msg" class="message"></div>
        <div class="customer-card">
            <div class="avatar" id="customer-avatar">👨‍🍳</div>
            <div id="customer-name" style="font-size: 11px; color: #666;">Customer</div>
            <div class="order-bubble">Wants: <span id="order-recipe">Loading...</span></div>
        </div>

        <!-- Current Noodle Bowl -->
        <div class="bowl-area">
            <div class="bowl-title">Your Tray & Bowl:</div>
            <div class="current-ingredients" id="bowl-contents">🥣 Empty Bowl</div>
        </div>
    </div>

    <!-- Kitchen Ingredients Grid -->
    <div class="kitchen-section">
        <div class="section-title">SELECT INGREDIENTS & DRINKS</div>
        <div class="ingredients-grid">
            <button class="ing-btn" onclick="addIngredient('🍜', 'Noodle')"><span>🍜</span>Noodle</button>
            <button class="ing-btn" onclick="addIngredient('🍗', 'Chicken')"><span>🍗</span>Chicken</button>
            <button class="ing-btn" onclick="addIngredient('🥩', 'Beef')"><span>🥩</span>Beef</button>
            <button class="ing-btn" onclick="addIngredient('🦐', 'Shrimp')"><span>🦐</span>Shrimp</button>

            <button class="ing-btn" onclick="addIngredient('🥦', 'Veggies')"><span>🥦</span>Veggies</button>
            <button class="ing-btn" onclick="addIngredient('🍄', 'Mushroom')"><span>🍄</span>Mushroom</button>
            <button class="ing-btn" onclick="addIngredient('🥚', 'Egg')"><span>🥚</span>Egg</button>
            <button class="ing-btn" onclick="addIngredient('🌶️', 'Chili')"><span>🌶️</span>Chili</button>

            <button class="ing-btn" onclick="addIngredient('🧋', 'Boba')"><span>🧋</span>Boba Tea</button>
            <button class="ing-btn" onclick="addIngredient('🍵', 'Green Tea')"><span>🍵</span>Green Tea</button>
            <button class="ing-btn" onclick="addIngredient('🥟', 'Gyoza')"><span>🥟</span>Gyoza</button>
            <button class="ing-btn" onclick="addIngredient('🥣', 'Miso')"><span>🥣</span>Miso Soup</button>
        </div>

        <div class="action-btns">
            <button class="clear-btn" onclick="clearBowl()">Reset 🗑️</button>
            <button class="serve-btn" onclick="serveBowl()">SERVE DISH 🍜</button>
        </div>
    </div>
</div>

    ];

    let currentRecipe = null;

    let timeLeft = 120; // 120 seconds (2 minutes) timer
    let gameActive = true;
